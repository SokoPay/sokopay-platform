# Local development services only. Production uses managed AWS RDS (PostgreSQL)
# and ElastiCache (Redis) in the af-south-1 (Cape Town) region.
#
# Start with:  docker compose up -d
# These credentials are for LOCAL DEVELOPMENT ONLY and are deliberately weak.
# They never appear in any deployed environment.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sokopay
      POSTGRES_USER: sokopay
      POSTGRES_PASSWORD: localdev_only
    ports:
      - "5432:5432"
    volumes:
      - sokopay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sokopay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sokopay_pgdata:
