# SokoPay on a single server (DigitalOcean droplet): production-style stack for a pilot
# test. See docs/DEPLOY-DIGITALOCEAN.md.
#
#   caddy   HTTPS (Let's Encrypt, automatic) in front of everything, ports 80/443
#   web     Django + gunicorn (API, portals, checkout pages, legal pages)
#   worker  Celery worker (pushes, webhooks, payouts, pollers)
#   beat    Celery beat (the scheduler: settlements, reconciliation, monitoring...)
#   db      PostgreSQL 16 (profile "localdb"; skip it when using DO Managed PostgreSQL)
#   redis   Redis 7 (cache, rate limits, one-time codes, task queue), password protected
#
# Only Caddy publishes ports. Postgres and Redis are reachable only inside this network.
# All settings and secrets come from ./.env (never committed; chmod 600).

name: sokopay

x-app: &app
  build: ../backend
  image: sokopay-backend:local
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
      required: false          # absent when COMPOSE_PROFILES doesn't include "localdb"
    redis:
      condition: service_healthy
  networks: [internal]

services:
  web:
    <<: *app
    command: ["gunicorn", "config.wsgi", "--bind", "0.0.0.0:8000", "--workers", "3",
              "--timeout", "45", "--access-logfile", "-"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]
    healthcheck:
      disable: true

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true

  db:
    image: postgres:16
    profiles: ["localdb"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: sokopay
      POSTGRES_USER: sokopay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sokopay -d sokopay"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SOKOPAY_DOMAIN: ${SOKOPAY_DOMAIN:?set SOKOPAY_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  internal:
