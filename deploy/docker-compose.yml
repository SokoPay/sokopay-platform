# SokoPay on a DigitalOcean droplet, as its own isolated project (it can share the droplet
# with other projects). Production-style stack for a pilot test. See docs/DEPLOY-DIGITALOCEAN.md.
#
# Isolation from other projects on the same droplet:
#   * project name "sokopay": every container, volume and network is prefixed sokopay-
#   * Postgres and Redis publish NO ports (private network only), so they never clash
#   * web publishes only 127.0.0.1:${SOKOPAY_WEB_PORT} for the droplet's existing reverse
#     proxy (Nginx/Caddy) to forward to; nothing else listens on the public interface
#   * memory limits on every service, so SokoPay can't starve the other projects
#
#   caddy   OPTIONAL (profile "caddy"): only when nothing else on the droplet uses 80/443
#   web     Django + gunicorn (API, portals, checkout pages, legal pages)
#   worker  Celery worker (pushes, webhooks, payouts, pollers)
#   beat    Celery beat (the scheduler: settlements, reconciliation, monitoring...)
#   db      PostgreSQL 16 (profile "localdb"; skip it when using DO Managed PostgreSQL)
#   redis   Redis 7 (cache, rate limits, one-time codes, task queue), password protected
#
# Postgres and Redis are reachable only inside this project's private network.
# All settings and secrets come from ./.env (never committed; chmod 600).

name: sokopay

x-app: &app
  build: ../backend
  image: sokopay-backend:local
  env_file: .env
  restart: unless-stopped
  mem_limit: 768m
  depends_on:
    db:
      condition: service_healthy
      required: false          # absent when COMPOSE_PROFILES doesn't include "localdb"
    redis:
      condition: service_healthy
  networks: [internal]

services:
  web:
    <<: *app
    command: ["gunicorn", "config.wsgi", "--bind", "0.0.0.0:8000", "--workers", "2",
              "--timeout", "45", "--access-logfile", "-"]
    # Reachable only from the droplet itself, for its reverse proxy (default 127.0.0.1:8100).
    ports: ["127.0.0.1:${SOKOPAY_WEB_PORT:-8100}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]
    mem_limit: 512m
    healthcheck:
      disable: true

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    mem_limit: 256m
    healthcheck:
      disable: true

  db:
    image: postgres:16
    profiles: ["localdb"]
    restart: unless-stopped
    mem_limit: 1g
    shm_size: 128m
    environment:
      POSTGRES_DB: sokopay
      POSTGRES_USER: sokopay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sokopay -d sokopay"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7
    restart: unless-stopped
    mem_limit: 320m
    # noeviction: the task queue lives here, so never silently drop entries.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes",
              "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    mem_limit: 128m
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SOKOPAY_DOMAIN: ${SOKOPAY_DOMAIN:?set SOKOPAY_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  internal:
