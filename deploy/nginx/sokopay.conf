# Nginx site for SokoPay on a droplet that already runs Nginx for other projects.
# Copy to /etc/nginx/sites-available/sokopay, replace test.sokopay.example with your
# SokoPay subdomain, enable, then get the certificate with certbot (guide section 7A).
# Only this server block is added; the other projects' sites are not changed.

upstream sokopay_web {
    server 127.0.0.1:8100;          # SOKOPAY_WEB_PORT in deploy/.env
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name test.sokopay.example;

    client_max_body_size 10m;       # bulk payout files, selfies
    server_tokens off;

    location / {
        proxy_pass http://sokopay_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }
}
# certbot --nginx adds the "listen 443 ssl" block and the HTTP->HTTPS redirect here.
