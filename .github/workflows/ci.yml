# Continuous integration: runs on every pull request and every push to main.
# Nothing here deploys; see deploy.yml (manual, with approval).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, security, tests on Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sokopay
          POSTGRES_USER: sokopay
          POSTGRES_PASSWORD: ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sokopay" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://sokopay:ci_only@127.0.0.1:5432/sokopay
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Security scan (no medium/high findings allowed)
        run: bandit -r apps config -x "*/tests/*" -ll -q
      - name: Known-vulnerable dependencies
        run: pip-audit -r requirements.txt --strict
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests (including the Postgres row-locking tests)
        run: pytest -p no:cacheprovider --cov=apps --cov-report=term-missing:skip-covered --cov-fail-under=80
      - name: Production settings refuse unsafe config
        run: |
          python - <<'EOF'
          import os, subprocess, sys
          env = dict(os.environ, DJANGO_SETTINGS_MODULE="config.settings.prod", RAIL_PROVIDER="mock",
                     SECRET_KEY="x" * 60, ALLOWED_HOSTS="api.example")
          r = subprocess.run([sys.executable, "manage.py", "check"], env=env, capture_output=True, text=True)
          sys.exit(0 if r.returncode != 0 else "prod settings accepted a mock rail")
          EOF

  mobile:
    name: Flutter apps (analyze + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze and test
        working-directory: mobile
        run: |
          set -e
          for d in packages/sokopay_shared customer agent merchant; do
            echo "::group::$d"
            (cd "$d" && flutter pub get && flutter analyze)
            if [ -d "$d/test" ]; then (cd "$d" && flutter test); fi
            echo "::endgroup::"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build test APKs (debug-signed, pointed at API_BASE_URL)
        working-directory: mobile
        env:
          API_BASE_URL: ${{ vars.TEST_API_BASE_URL || 'http://10.0.2.2:8000/api/v1' }}
        run: |
          for app in customer agent merchant; do
            (cd "$app" && flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL")
            cp "$app/build/app/outputs/flutter-apk/app-release.apk" "sokopay-$app.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sokopay-test-apks
          path: mobile/sokopay-*.apk
          retention-days: 14

  infra:
    name: Terraform (format + validate, no AWS access)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (not pushed)
        run: docker build -t sokopay-backend:ci backend
      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sokopay-backend:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
