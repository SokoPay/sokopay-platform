# Deploy: manual only. Build → push to ECR → run migrations as a one-off task → roll the
# services onto the new image with Terraform. "production" is a protected GitHub
# environment: a second person must approve (Settings → Environments → required reviewers).
#
# AWS access is by OpenID Connect (no long-lived keys in GitHub): create an IAM role that
# trusts token.actions.githubusercontent.com for this repo, and store its ARN as the
# environment secret AWS_DEPLOY_ROLE_ARN. [VERIFY before first use: nothing has been applied yet]
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy"
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read
  id-token: write          # OIDC to AWS

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: af-south-1
  ECR_REPOSITORY: sokopay-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image (tagged with the commit)
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform plan
        working-directory: infra
        env:
          TF_VAR_container_image: ${{ steps.image.outputs.uri }}
        run: |
          terraform init -input=false -backend-config="key=sokopay/${{ inputs.environment }}.tfstate"
          terraform plan -input=false -var-file="${{ inputs.environment }}.tfvars" -out=tfplan

      - name: Run database migrations (one-off task on the new image, before traffic moves)
        working-directory: infra
        run: |
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          TASKDEF=$(terraform output -raw api_task_definition_family)
          SUBNETS=$(terraform output -json private_subnet_ids | jq -r 'join(",")')
          SG=$(terraform output -raw app_security_group_id)
          ARN=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$TASKDEF" --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"api\",\"image\":\"${{ steps.image.outputs.uri }}\",\"command\":[\"python\",\"manage.py\",\"migrate\",\"--noinput\"]}]}" \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$ARN"
          CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          test "$CODE" = "0" || { echo "Migrations failed (exit $CODE). Nothing was rolled out."; exit 1; }

      - name: Roll out (Terraform apply of the reviewed plan)
        working-directory: infra
        run: terraform apply -input=false tfplan

      - name: Wait until the API is healthy
        working-directory: infra
        run: |
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          aws ecs wait services-stable --cluster "$CLUSTER"             --services "$(terraform output -raw api_service_name)" "$(terraform output -raw worker_service_name)"
