name: sokopay_customer
description: SokoPay customer app — pay bills, airtime/data, and merchants.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  sokopay_shared:                # shared core (theme, API client, auth flow)
    path: ../packages/sokopay_shared
  dio: ^5.7.0                     # used directly for DioException handling
  provider: ^6.1.2               # lightweight state management
  go_router: ^14.6.2             # declarative routing
  intl: ^0.19.0                  # number/date formatting
  mobile_scanner: ^6.0.2         # QR scanning (scan-to-pay)
  image_picker: ^1.1.2           # front-camera selfie for tier-2 KYC
  firebase_core: ^3.8.1          # push notifications (needs a Firebase project — see README)
  firebase_messaging: ^15.1.6

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

# Pinned to the last versions without native build hooks (objective_c / jni). Newer ones need
# the Android NDK (2+ GB) and hang `flutter test` on Windows. Same behaviour for this app.
# Revisit when upgrading Flutter.
dependency_overrides:
  path_provider_foundation: 2.4.4
  path_provider_android: 2.2.23
