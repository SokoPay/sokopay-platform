# Sized for developer laptops and CI runners: a 2 GB build heap is plenty for these apps.
# No heap dumps (they are GBs and filled the disk); Kotlin compiles inside the Gradle
# daemon instead of starting a second JVM.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
