{% extends "portal/base.html" %}
{% block title %}Sign in · SokoPay{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16">
  <div class="text-center mb-6">
    <div class="text-2xl font-bold">SOKO<span class="text-orange">PAY</span></div>
    <p class="text-ink/60 text-sm mt-1">Merchant & staff portal</p>
  </div>
  <form method="post" class="bg-surface rounded-lg shadow-sm p-6 space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm mb-1">Phone</label>
      <input name="phone" value="{{ form.phone.value|default:'' }}" placeholder="+233244058519"
             class="w-full border border-gray-200 rounded-md px-3 py-2" autofocus>
    </div>
    <div>
      <label class="block text-sm mb-1">Password</label>
      <input name="password" type="password"
             class="w-full border border-gray-200 rounded-md px-3 py-2">
    </div>
    <button class="w-full bg-orange hover:bg-orange-dark text-white rounded-md py-2 font-medium">
      Sign in
    </button>
  </form>
  <p class="text-xs text-ink/40 text-center mt-4">
    Staff accounts require two-factor authentication (enrolment: next milestone).
  </p>
</div>
{% endblock %}
