{% extends "portal/base.html" %}
{% block title %}Forgot password · SokoPay{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16">
  <h1 class="text-xl font-semibold mb-2">Forgot your password?</h1>
  <p class="text-sm text-ink/60 mb-6">Enter the phone number you sign in with. If it has a portal account, we'll text
    you a code to set a new password.</p>
  <form method="post" class="bg-surface rounded-lg shadow-sm p-6 space-y-3 text-sm">
    {% csrf_token %}
    <label class="block">Phone number
      <input name="phone" required inputmode="tel" placeholder="0244058519" autofocus
             class="mt-1 w-full border border-gray-200 rounded-md px-3 py-2"></label>
    <button class="w-full bg-orange hover:bg-orange-dark text-white rounded-md py-2">Send code</button>
  </form>
  <p class="text-xs text-ink/40 mt-4 text-center"><a href="{% url 'portal:login' %}" class="underline">Back to sign in</a></p>
</div>
{% endblock %}
