{% load money_tags %}
{% for p in payments %}
<tr class="border-t border-gray-50">
  <td class="px-5 py-2 font-mono text-xs"><a class="hover:text-orange" href="{% url 'portal:payment_detail' p.reference %}">{{ p.reference }}</a></td>
  <td>{{ p.created_at|date:"d M Y, H:i" }}</td>
  <td class="capitalize">{{ p.get_purpose_display }}</td>
  <td class="uppercase">{{ p.network }}</td>
  <td class="text-right px-5 tabular-nums">{{ p.amount_minor|ghs }}</td>
  <td class="px-5">{% include "portal/_status_pill.html" with status=p.status %}</td>
</tr>
{% empty %}
<tr><td colspan="6" class="px-5 py-8 text-center text-ink/40">No payments found.</td></tr>
{% endfor %}
