{% extends "portal/base.html" %}
{% load money_tags %}
{% block title %}Payments · SokoPay{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold mb-4">Payments</h1>

<div class="mb-4 flex gap-2 text-sm">
  <a href="{% url 'portal:payments' %}" class="px-3 py-1 rounded-md border border-ink/15 hover:border-orange">All</a>
  <a href="?status=pending" class="px-3 py-1 rounded-md border border-ink/15 hover:border-orange">Pending</a>
  <a href="?status=succeeded" class="px-3 py-1 rounded-md border border-ink/15 hover:border-orange">Succeeded</a>
  <a href="?status=failed" class="px-3 py-1 rounded-md border border-ink/15 hover:border-orange">Failed</a>
</div>

<div class="bg-surface rounded-lg shadow-sm overflow-hidden">
  <table class="w-full text-sm">
    <thead class="text-ink/50 text-left">
      <tr><th class="px-5 py-2">Reference</th><th>When</th><th>Purpose</th><th>Network</th>
          <th class="text-right px-5">Amount</th><th class="px-5">Status</th></tr>
    </thead>
    <tbody>
      {% include "portal/merchant/_payments_rows.html" %}
    </tbody>
  </table>
</div>
{% endblock %}
