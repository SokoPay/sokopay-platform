{% load money_tags %}
<div id="txn-summary" class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-4"
     {% if day == today %}hx-get="?day={{ day|date:'Y-m-d' }}&partial=summary" hx-trigger="every 20s" hx-swap="outerHTML"{% endif %}>
  {% for key, v in s.by_status.items %}
  <a href="?day={{ day|date:'Y-m-d' }}&status={{ key }}" class="bg-surface rounded-lg shadow-sm p-3 hover:ring-2 hover:ring-orange/40">
    <div class="text-xs text-ink/60">{% for k, label in labels.items %}{% if k == key %}{{ label }}{% endif %}{% endfor %}</div>
    <div class="text-xl font-semibold {% if key == 'failed' and v.count %}text-danger{% endif %}">{{ v.count }}</div>
    <div class="text-xs text-ink/50 tabular-nums">{{ v.value|ghs }}</div>
  </a>
  {% endfor %}
</div>
