{% extends "checkout/base.html" %}
{% block title %}{{ title }} · SokoPay{% endblock %}
{% block content %}
<nav class="text-xs text-ink/50 mb-3"><a href="/legal/" class="hover:text-orange">Legal</a> / {{ title }}</nav>
<article class="bg-surface rounded-xl shadow-sm p-5 legal text-sm leading-relaxed">{{ body }}</article>
<style>
  .legal h1{font-size:1.4rem;font-weight:700;margin-bottom:.5rem}
  .legal h2{font-size:1.05rem;font-weight:600;margin:1.2rem 0 .4rem}
  .legal p,.legal ul,.legal ol,.legal table{margin:.5rem 0}
  .legal ul{list-style:disc;padding-left:1.2rem}.legal ol{list-style:decimal;padding-left:1.2rem}
  .legal table{width:100%;border-collapse:collapse;font-size:.8rem;display:block;overflow-x:auto}
  .legal th,.legal td{border:1px solid #eee;padding:.35rem;text-align:left;vertical-align:top}
  .legal blockquote{background:#fff7ed;border-left:3px solid #F26522;padding:.5rem .75rem;font-size:.8rem}
  .legal a{color:#D4541A}
</style>
{% endblock %}
