<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Pay with SokoPay{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      ink: "#231F20", orange: { DEFAULT: "#F26522", dark: "#D4541A" }, surface: "#FFFFFF",
      success: "#1E8E3E", danger: "#C62828", warning: "#B26A00" } } } };
  </script>
</head>
<body class="bg-[#F7F5F4] text-ink min-h-screen">
  {% if environment_banner %}<div style="background:#B26A00;color:#fff;text-align:center;font:600 12px/1.6 system-ui,sans-serif;padding:3px 8px">{{ environment_banner }}</div>{% endif %}

  <header class="bg-ink text-white"><div class="max-w-md mx-auto px-4 h-14 flex items-center font-bold tracking-wide">SOKO<span class="text-orange">PAY</span></div></header>
  <main class="max-w-md mx-auto px-4 py-6">{% block content %}{% endblock %}</main>
  <footer class="max-w-md mx-auto px-4 pb-8 text-xs text-ink/40">Payments processed by SokoPay. Never share your mobile money PIN with anyone, including the shop.
    <div class="mt-2 space-x-3"><a href="/legal/privacy-policy" class="underline">Privacy</a><a href="/legal/terms-of-service" class="underline">Terms</a><a href="/legal/complaints-and-disputes" class="underline">Complaints</a></div></footer>
</body>
</html>
